<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151517" />
    <title>Animus Türkçe Yama</title>

    <link rel="stylesheet" href="/src/splash.css" />
  </head>

  <body class="splash-active">
    <div
      id="animus-startup-splash"
      class="startup-splash"
      role="status"
      aria-label="Animus Çeviri yükleniyor"
    >
      <div class="startup-splash-center">
        <img
          class="startup-splash-logo"
          src="/animus-logo.png"
          alt="Animus Çeviri"
          draggable="false"
        />
      </div>

      <div class="startup-splash-brand" aria-hidden="true">
        <img
          class="startup-splash-brand-logo"
          src="/animus-logo.png"
          alt=""
          draggable="false"
        />
        <span class="startup-splash-divider"></span>
        <span class="startup-splash-name">Animus Çeviri</span>
      </div>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/splash.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
